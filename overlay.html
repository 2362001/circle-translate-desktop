<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Circle Translate Overlay</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        cursor: crosshair;
        -webkit-app-region: no-drag;
      }

      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(1px);
      }

      #canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #hint {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(79, 172, 254, 0.95);
        color: white;
        padding: 20px 40px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        font-family: "Segoe UI", Arial, sans-serif;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        animation: fadeIn 0.3s ease-out;
        pointer-events: none;
        text-align: center;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translate(-50%, -50%) translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) translateY(0);
        }
      }

      #popup {
        position: fixed;
        display: none;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        font-family: "Segoe UI", Arial, sans-serif;
        min-width: 250px;
        max-width: 400px;
        z-index: 10000;
      }

      .popup-word {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .popup-translation {
        font-size: 16px;
        line-height: 1.5;
      }

      .popup-loading {
        font-style: italic;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="overlay"></div>
    <canvas id="canvas"></canvas>
    <div id="hint">
      🎯 Kéo chuột để chọn vùng văn bản<br />
      <span style="font-size: 14px; opacity: 0.9"
        >Hình chữ nhật giúp nhận diện chuẩn hơn</span
      >
    </div>
    <div id="popup">
      <div class="popup-word" id="popup-word"></div>
      <div class="popup-translation" id="popup-translation"></div>
    </div>

    <script>
      const { ipcRenderer } = require("electron");

      const overlay = document.getElementById("overlay");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const hint = document.getElementById("hint");
      const popup = document.getElementById("popup");

      // Setup canvas
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // Drawing state
      let isDrawing = false;
      let startX, startY;

      // Hide hint after 3 seconds
      setTimeout(() => {
        hint.style.display = "none";
      }, 3000);

      // Setup canvas style
      ctx.strokeStyle = "#4facfe";
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]); // Nét đứt cho chuyên nghiệp

      // Mouse events
      overlay.addEventListener("mousedown", (e) => {
        isDrawing = true;
        startX = e.clientX;
        startY = e.clientY;
        popup.style.display = "none";
      });

      overlay.addEventListener("mousemove", (e) => {
        if (!isDrawing) return;

        const currentX = e.clientX;
        const currentY = e.clientY;

        // Xóa canvas cũ để vẽ hình chữ nhật mới
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Vẽ vùng tối xung quanh (dim layer)
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Đục lỗ hình chữ nhật đang chọn (clear vùng chọn)
        const rectX = Math.min(startX, currentX);
        const rectY = Math.min(startY, currentY);
        const rectW = Math.abs(currentX - startX);
        const rectH = Math.abs(currentY - startY);

        ctx.clearRect(rectX, rectY, rectW, rectH);

        // Vẽ viền cho hình chữ nhật
        ctx.strokeRect(rectX, rectY, rectW, rectH);
      });

      overlay.addEventListener("mouseup", async (e) => {
        if (!isDrawing) return;
        isDrawing = false;

        const endX = e.clientX;
        const endY = e.clientY;

        const rectX = Math.min(startX, endX);
        const rectY = Math.min(startY, endY);
        const rectW = Math.abs(endX - startX);
        const rectH = Math.abs(endY - startY);

        if (rectW < 5 || rectH < 5) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          return;
        }

        // Show loading
        showPopup("Đang nhận diện...", "", endX, endY, true);

        // Send OCR request to main process
        ipcRenderer.send("ocr-request", {
          x: rectX,
          y: rectY,
          width: rectW,
          height: rectH,
          popupX: endX,
          popupY: endY,
        });
      });

      // Keyboard events
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeOverlay();
        }
      });

      // Listen for OCR result
      ipcRenderer.on("ocr-result", (event, data) => {
        const { text, error, popupX, popupY } = data;

        if (error) {
          showPopup("Lỗi OCR", error, popupX, popupY);
          setTimeout(closeOverlay, 3000);
          return;
        }

        if (!text || text.trim().length === 0) {
          showPopup("Không thấy chữ", "Hãy thử quét vùng khác", popupX, popupY);
          setTimeout(closeOverlay, 3000);
          return;
        }

        // Translate
        showPopup(text, "Đang dịch...", popupX, popupY, true);
        ipcRenderer.send("translate-text", text);
      });

      // Show popup
      function showPopup(word, translation, x, y, isLoading = false) {
        document.getElementById("popup-word").textContent = word;
        document.getElementById("popup-translation").textContent = translation;
        document.getElementById("popup-translation").className = isLoading
          ? "popup-translation popup-loading"
          : "popup-translation";

        popup.style.left = `${x + 15}px`;
        popup.style.top = `${y + 15}px`;
        popup.style.display = "block";
      }

      // Listen for translation result
      ipcRenderer.on("translation-result", (event, data) => {
        const { original, translation, language } = data;
        const langLabel = language === "en" ? "English" : "Tiếng Việt";
        showPopup(
          `${original} [${langLabel}]`,
          translation,
          popup.offsetLeft,
          popup.offsetTop
        );

        // Auto close after 5 seconds
        setTimeout(closeOverlay, 5000);
      });

      // Close overlay
      function closeOverlay() {
        ipcRenderer.send("hide-overlay");

        // Reset
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        popup.style.display = "none";
      }
    </script>
  </body>
</html>
